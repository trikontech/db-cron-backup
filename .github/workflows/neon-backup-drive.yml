name: "Daily Neon DB Backup to Google Drive"

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup-to-gdrive:
    name: Neon DB Backup & Google Drive Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Latest PostgreSQL Client Tools (v17/v18)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release curl
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 postgresql-client-common

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Decode Google Service Account Key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" > service-account-key.json
            chmod 600 service-account-key.json
          else
            echo "::error::Secret GCP_SERVICE_ACCOUNT_KEY is missing! Add it in GitHub Repo Settings -> Secrets & Variables."
            exit 1
          fi

      - name: Run Backup & Upload to Drive
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          LOCAL_BACKUP_DIR: './backups'
          RETENTION_DAYS_LOCAL: '7'
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SERVICE_ACCOUNT_KEY_FILE: './service-account-key.json'
        run: |
          chmod +x backup.sh
          ./backup.sh