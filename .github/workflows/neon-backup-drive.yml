name: "Daily Neon DB Backup to Google Drive"

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup-to-gdrive:
    name: Neon DB Backup & Google Drive Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Latest PostgreSQL Client Tools (PGDG)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release curl
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Decode Google Service Account Key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" > service-account-key.json
            chmod 600 service-account-key.json
          else
            echo "::error::Secret GCP_SERVICE_ACCOUNT_KEY is missing! Add it in GitHub Repo Settings -> Secrets & Variables."
            exit 1
          fi

      - name: Run Backup & Upload to Drive
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          LOCAL_BACKUP_DIR: './backups'
          RETENTION_DAYS_LOCAL: '7'
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SERVICE_ACCOUNT_KEY_FILE: './service-account-key.json'
        run: |
          chmod +x backup.sh
          ./backup.sh

      - name: Save Backup to GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-db-backup-${{ github.run_id }}
          path: ./backups/*.dump
          retention-days: 30